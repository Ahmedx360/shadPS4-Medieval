name: Build shadPS4 Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake with Clang Toolset
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL -DCMAKE_BUILD_TYPE=Release

      - name: Build shadPS4 Release
        run: |
          cmake --build build --config Release --parallel

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-windows-release
          path: build/Release/shadps4.exe
